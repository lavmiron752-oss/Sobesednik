<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2430;
    --panel: #212C3B;
    --panel-2: #26324294;
    --ink: #E8ECF1;
    --ink-dim: #8FA0B3;
    --gold: #D4A857;
    --teal: #5B8A96;
    --line: #33445B;
  }
  html[data-theme="light"]{
    --bg: #F4F1EA;
    --panel: #FFFFFF;
    --panel-2: #ffffff94;
    --ink: #24303E;
    --ink-dim: #6B7686;
    --gold: #B8863B;
    --teal: #3E7480;
    --line: #DCD6C8;
  }
  html[data-theme="sepia"]{
    --bg: #241B14;
    --panel: #2E241A;
    --panel-2: #2E241A94;
    --ink: #EFE2CC;
    --ink-dim: #A6906F;
    --gold: #E0A951;
    --teal: #8A6B47;
    --line: #47372A;
  }
  *{ box-sizing: border-box; }
  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  body{
    display: flex;
    flex-direction: column;
  }

  header{
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .brand{
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .brand span{ color: var(--gold); }
  .header-controls{
    display: flex;
    gap: 8px;
    margin-left: 14px;
    margin-right: auto;
  }
  #voiceToggle, #themeToggle, #clearBtn{
    background: none;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink-dim);
    font-size: 15px;
    padding: 4px 9px;
    cursor: pointer;
    line-height: 1;
  }
  #voiceToggle.on{
    border-color: var(--gold);
    color: var(--gold);
  }
  .status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .status.busy::before{
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 6px;
    animation: pulse 1s infinite ease-in-out;
    vertical-align: middle;
  }
  .status.idle::before{
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes pulse{ 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  main{
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .empty{
    margin: auto;
    text-align: center;
    color: var(--ink-dim);
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-style: italic;
    line-height: 1.6;
    max-width: 380px;
  }

  .msg{
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 88%;
  }
  .msg.user{ align-self: flex-end; align-items: flex-end; }
  .msg.bot{ align-self: flex-start; align-items: flex-start; }

  .label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 0 2px;
  }

  .bubble{
    padding: 12px 15px;
    border-radius: 3px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble{
    background: var(--panel);
    border: 1px solid var(--line);
    border-right: 2px solid var(--gold);
  }
  .msg.bot .bubble{
    background: transparent;
    border-left: 2px solid var(--teal);
    padding-left: 14px;
  }

  .dots{
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .dots span{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--teal);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay: 0.15s; }
  .dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity: 0.4; } 30%{ transform: translateY(-4px); opacity: 1; } }

  footer{
    border-top: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  form{
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea{
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    max-height: 140px;
    line-height: 1.4;
  }
  textarea:focus{
    outline: none;
    border-color: var(--teal);
  }
  button{
    background: var(--gold);
    color: #1B2430;
    border: none;
    border-radius: 3px;
    padding: 12px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  button:disabled{ opacity: 0.4; cursor: default; }
  button:not(:disabled):hover{ opacity: 0.85; }

  #attachBtn, #micBtn{
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 17px;
    padding: 10px 11px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #attachBtn.has-image{ border-color: var(--gold); }
  #attachBtn.disabled, #micBtn:disabled{ opacity: 0.4; pointer-events: none; }
  #micBtn.recording{
    border-color: var(--gold);
    color: var(--gold);
    animation: pulse 1s infinite ease-in-out;
  }

  #previewRow{
    max-width: 720px;
    margin: 10px auto 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .preview-thumb{
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .preview-thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .preview-thumb .remove{
    position: absolute;
    top: 0; right: 0;
    background: rgba(0,0,0,0.6);
    color: #fff;
    width: 18px; height: 18px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 0 0 0 4px;
  }

  .bubble img.msg-img{
    max-width: 220px;
    border-radius: 4px;
    display: block;
    margin-bottom: 8px;
  }

  main::-webkit-scrollbar{ width: 6px; }
  main::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="brand">со<span>беседник</span></div>
  <div class="header-controls">
    <button type="button" id="themeToggle" title="Тема оформления">🌙</button>
    <button type="button" id="voiceToggle" title="Озвучка ответов">🔇</button>
    <button type="button" id="clearBtn" title="Очистить историю">🗑️</button>
  </div>
  <div class="status idle" id="status">готов</div>
</header>

<main id="chat">
  <div class="empty" id="emptyState">Напиши что-нибудь —<br>и начнём разговор.</div>
</main>

<footer>
  <form id="form">
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <label for="fileInput" id="attachBtn" title="Прикрепить фото">📷</label>
    <button type="button" id="micBtn" title="Голосовой ввод">🎙️</button>
    <textarea id="input" rows="1" placeholder="Сообщение..." autofocus></textarea>
    <button type="submit" id="sendBtn">Отправить</button>
  </form>
  <div id="previewRow"></div>
</footer>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const voiceToggle = document.getElementById('voiceToggle');
  const themeToggle = document.getElementById('themeToggle');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const previewRow = document.getElementById('previewRow');
  const micBtn = document.getElementById('micBtn');

  // ---- Theme switching ----
  const themes = ['dark', 'light', 'sepia'];
  const themeIcons = { dark: '🌙', light: '☀️', sepia: '📜' };
  let themeIndex = 0;
  try {
    const savedTheme = localStorage.getItem('sobesednik-theme');
    if (savedTheme && themes.includes(savedTheme)) themeIndex = themes.indexOf(savedTheme);
  } catch (e) {}
  function applyTheme() {
    const t = themes[themeIndex];
    if (t === 'dark') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = themeIcons[t];
    try { localStorage.setItem('sobesednik-theme', t); } catch (e) {}
  }
  applyTheme();
  themeToggle.addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % themes.length;
    applyTheme();
  });

  // ---- Voice output (text-to-speech) ----
  let voiceOn = false;
  voiceToggle.addEventListener('click', () => {
    voiceOn = !voiceOn;
    voiceToggle.textContent = voiceOn ? '🔊' : '🔇';
    voiceToggle.classList.toggle('on', voiceOn);
    if (!voiceOn) window.speechSynthesis.cancel();
  });

  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ru-RU';
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }

  // ---- Voice input (speech-to-text) ----
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  if (SpeechRecognitionCtor) {
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.addEventListener('result', (e) => {
      const transcript = e.results[0][0].transcript;
      input.value = (input.value ? input.value + ' ' : '') + transcript;
      input.dispatchEvent(new Event('input'));
    });
    recognition.addEventListener('end', () => {
      listening = false;
      micBtn.classList.remove('recording');
    });
    recognition.addEventListener('error', () => {
      listening = false;
      micBtn.classList.remove('recording');
    });

    micBtn.addEventListener('click', () => {
      if (listening) {
        recognition.stop();
        return;
      }
      listening = true;
      micBtn.classList.add('recording');
      try { recognition.start(); } catch (e) { listening = false; micBtn.classList.remove('recording'); }
    });
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Голосовой ввод не поддерживается этим браузером';
  }

  let emptyState = document.getElementById('emptyState');

  let history = [];
  let sending = false;
  let pendingImages = []; // { mediaType, base64, dataUrl }

  // ---- Chat history persistence ----
  function saveHistory() {
    try { localStorage.setItem('sobesednik-history', JSON.stringify(history)); } catch (e) {}
  }
  function loadHistory() {
    try {
      const raw = localStorage.getItem('sobesednik-history');
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (!Array.isArray(saved)) return;
      history = saved;
      saved.forEach(msg => {
        const role = msg.role === 'user' ? 'user' : 'bot';
        if (typeof msg.content === 'string') {
          addMessage(role, msg.content);
        } else if (Array.isArray(msg.content)) {
          const textPart = msg.content.find(b => b.type === 'text');
          const imgParts = msg.content.filter(b => b.type === 'image_url').map(b => b.image_url);
          addMessage(role, textPart ? textPart.text : '', imgParts);
        }
      });
    } catch (e) {}
  }

  function clearEmptyState() {
    if (emptyState) {
      emptyState.remove();
      emptyState = null;
    }
  }

  // ---- Photo attach ----
  fileInput.addEventListener('change', async () => {
    const files = Array.from(fileInput.files || []);
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const base64 = dataUrl.split(',')[1];
      pendingImages.push({ mediaType: file.type, base64, dataUrl });
    }
    fileInput.value = '';
    renderPreviews();
  });

  function renderPreviews() {
    previewRow.innerHTML = '';
    attachBtn.classList.toggle('has-image', pendingImages.length > 0);
    pendingImages.forEach((img, idx) => {
      const thumb = document.createElement('div');
      thumb.className = 'preview-thumb';
      const im = document.createElement('img');
      im.src = img.dataUrl;
      const rm = document.createElement('div');
      rm.className = 'remove';
      rm.textContent = '✕';
      rm.addEventListener('click', () => {
        pendingImages.splice(idx, 1);
        renderPreviews();
      });
      thumb.appendChild(im);
      thumb.appendChild(rm);
      previewRow.appendChild(thumb);
    });
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  function addMessage(role, text, images) {
    clearEmptyState();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = role === 'user' ? 'вы' : 'собеседник';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (images && images.length) {
      images.forEach(src => {
        const im = document.createElement('img');
        im.className = 'msg-img';
        im.src = src;
        bubble.appendChild(im);
      });
    }
    if (text) {
      const textNode = document.createElement('div');
      textNode.textContent = text;
      bubble.appendChild(textNode);
    }
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    clearEmptyState();
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typingIndicator';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'собеседник';
    const dots = document.createElement('div');
    dots.className = 'dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(label);
    wrap.appendChild(dots);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    if (sending) return;
    const text = input.value.trim();
    const images = pendingImages;
    if (!text && images.length === 0) return;

    sending = true;
    input.value = '';
    input.style.height = 'auto';
    input.disabled = true;
    sendBtn.disabled = true;
    attachBtn.classList.add('disabled');
    statusEl.className = 'status busy';
    statusEl.textContent = 'думает';

    const dataUrls = images.map(img => img.dataUrl);
    addMessage('user', text, dataUrls);

    const contentBlocks = images.map(img => ({
      type: 'image_url',
      image_url: img.dataUrl
    }));
    if (text) contentBlocks.push({ type: 'text', text });
    if (contentBlocks.length === 1 && contentBlocks[0].type === 'image_url' && !text) {
      contentBlocks.push({ type: 'text', text: 'Опиши, что на фото.' });
    }

    const userContent = images.length ? contentBlocks : text;
    history.push({ role: 'user', content: userContent });
    saveHistory();
    pendingImages = [];
    renderPreviews();
    addTyping();

    try {
      const systemPrompt = "Ты дружелюбный собеседник, разбирающийся в интернет-культуре. Объясняй мемы понятно: суть, откуда пошло, почему смешно.";
      const response = await fetch("https://api.mistral.ai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer 1S8f39QhTgr2ZZc8g3mHytyzJx9cWRFK"
        },
        body: JSON.stringify({
          model: images.length ? "pixtral-large-latest" : "mistral-large-latest",
          messages: [{ role: "system", content: systemPrompt }, ...history]
        })
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error('HTTP ' + response.status + ' ' + errText.slice(0, 200));
      }

      const data = await response.json();
      removeTyping();

      const reply = data.choices?.[0]?.message?.content?.trim() || 'Не получилось сформировать ответ.';

      addMessage('bot', reply);
      history.push({ role: 'assistant', content: reply });
      saveHistory();
      speak(reply);
    } catch (err) {
      removeTyping();
      addMessage('bot', '⚠ Ошибка: ' + (err && err.message ? err.message : String(err)));
    } finally {
      sending = false;
      input.disabled = false;
      sendBtn.disabled = false;
      attachBtn.classList.remove('disabled');
      statusEl.className = 'status idle';
      statusEl.textContent = 'готов';
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage();
  });

  sendBtn.addEventListener('click', (e) => {
    e.preventDefault();
    sendMessage();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  window.addEventListener('error', (e) => {
    addMessage('bot', '⚠ Скрипт: ' + e.message);
  });

  loadHistory();

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Очистить всю переписку?')) return;
    history = [];
    try { localStorage.removeItem('sobesednik-history'); } catch (e) {}
    chat.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.id = 'emptyState';
    empty.innerHTML = 'Напиши что-нибудь —<br>и начнём разговор.';
    chat.appendChild(empty);
    emptyState = empty;
  });
</script>

</body>
</html>
