<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2430;
    --panel: #212C3B;
    --panel-2: #26324294;
    --ink: #E8ECF1;
    --ink-dim: #8FA0B3;
    --gold: #D4A857;
    --teal: #5B8A96;
    --line: #33445B;
  }
  *{ box-sizing: border-box; }
  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  body{
    display: flex;
    flex-direction: column;
  }

  header{
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .brand{
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .brand span{ color: var(--gold); }
  #voiceToggle{
    background: none;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink-dim);
    font-size: 15px;
    padding: 4px 9px;
    cursor: pointer;
    line-height: 1;
    margin-right: auto;
    margin-left: 14px;
  }
  #voiceToggle.on{
    border-color: var(--gold);
    color: var(--gold);
  }
  .status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .status.busy::before{
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 6px;
    animation: pulse 1s infinite ease-in-out;
    vertical-align: middle;
  }
  .status.idle::before{
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes pulse{ 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  main{
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .empty{
    margin: auto;
    text-align: center;
    color: var(--ink-dim);
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-style: italic;
    line-height: 1.6;
    max-width: 380px;
  }

  .msg{
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 88%;
  }
  .msg.user{ align-self: flex-end; align-items: flex-end; }
  .msg.bot{ align-self: flex-start; align-items: flex-start; }

  .label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 0 2px;
  }

  .bubble{
    padding: 12px 15px;
    border-radius: 3px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble{
    background: var(--panel);
    border: 1px solid var(--line);
    border-right: 2px solid var(--gold);
  }
  .msg.bot .bubble{
    background: transparent;
    border-left: 2px solid var(--teal);
    padding-left: 14px;
  }

  .dots{
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .dots span{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--teal);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay: 0.15s; }
  .dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity: 0.4; } 30%{ transform: translateY(-4px); opacity: 1; } }

  footer{
    border-top: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  form{
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea{
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    max-height: 140px;
    line-height: 1.4;
  }
  textarea:focus{
    outline: none;
    border-color: var(--teal);
  }
  button{
    background: var(--gold);
    color: #1B2430;
    border: none;
    border-radius: 3px;
    padding: 12px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  button:disabled{ opacity: 0.4; cursor: default; }
  button:not(:disabled):hover{ opacity: 0.85; }

  main::-webkit-scrollbar{ width: 6px; }
  main::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="brand">со<span>беседник</span></div>
  <button type="button" id="voiceToggle" title="Озвучка ответов">🔇</button>
  <div class="status idle" id="status">готов</div>
</header>

<main id="chat">
  <div class="empty" id="emptyState">Напиши что-нибудь —<br>и начнём разговор.</div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Сообщение..." autofocus></textarea>
    <button type="submit" id="sendBtn">Отправить</button>
  </form>
</footer>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const voiceToggle = document.getElementById('voiceToggle');

  let voiceOn = false;
  voiceToggle.addEventListener('click', () => {
    voiceOn = !voiceOn;
    voiceToggle.textContent = voiceOn ? '🔊' : '🔇';
    voiceToggle.classList.toggle('on', voiceOn);
    if (!voiceOn) window.speechSynthesis.cancel();
  });

  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ru-RU';
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }
  let emptyState = document.getElementById('emptyState');

  let history = [];
  let sending = false;

  function clearEmptyState() {
    if (emptyState) {
      emptyState.remove();
      emptyState = null;
    }
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  function addMessage(role, text) {
    clearEmptyState();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = role === 'user' ? 'вы' : 'собеседник';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    clearEmptyState();
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typingIndicator';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'собеседник';
    const dots = document.createElement('div');
    dots.className = 'dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(label);
    wrap.appendChild(dots);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    if (sending) return;
    const text = input.value.trim();
    if (!text) return;

    sending = true;
    input.value = '';
    input.style.height = 'auto';
    input.disabled = true;
    sendBtn.disabled = true;
    statusEl.className = 'status busy';
    statusEl.textContent = 'думает';

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    addTyping();

    try {
      const systemPrompt = "Ты дружелюбный собеседник, разбирающийся в интернет-культуре. Объясняй мемы понятно: суть, откуда пошло, почему смешно.";
      const response = await fetch("https://api.mistral.ai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer 1S8f39QhTgr2ZZc8g3mHytyzJx9cWRFK"
        },
        body: JSON.stringify({
          model: "mistral-large-latest",
          messages: [{ role: "system", content: systemPrompt }, ...history]
        })
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error('HTTP ' + response.status + ' ' + errText.slice(0, 200));
      }

      const data = await response.json();
      removeTyping();

      const reply = data.choices?.[0]?.message?.content?.trim() || 'Не получилось сформировать ответ.';

      addMessage('bot', reply);
      history.push({ role: 'assistant', content: reply });
      speak(reply);
    } catch (err) {
      removeTyping();
      addMessage('bot', '⚠ Ошибка: ' + (err && err.message ? err.message : String(err)));
    } finally {
      sending = false;
      input.disabled = false;
      sendBtn.disabled = false;
      statusEl.className = 'status idle';
      statusEl.textContent = 'готов';
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage();
  });

  sendBtn.addEventListener('click', (e) => {
    e.preventDefault();
    sendMessage();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  window.addEventListener('error', (e) => {
    addMessage('bot', '⚠ Скрипт: ' + e.message);
  });
</script>

</body>
</html>
